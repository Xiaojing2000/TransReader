name: Bug report / 错误报告
description: Report a reproducible problem / 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping TransReader improve! 请勿粘贴 API Key、私人 PDF 内容或完整日志中的敏感信息。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: v0.3.0, Setup or Portable
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 发生了什么？
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Open...
        2. Choose...
        3. See...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Translation mode / 翻译模式
      options:
        - Not related / 无关
        - Online API / 在线 API
        - Local AI / 本地 AI
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / 已脱敏日志
      description: Remove API keys, file names, document text, and personal paths before pasting.
      render: text
